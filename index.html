<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Park captive portal pages - draft</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f0ede8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    background: #fff;
    border-radius: 2px;
    max-width: 480px;
    width: 100%;
    overflow: hidden;
    box-shadow: 0 2px 24px rgba(0,0,0,0.08);
  }

  .card-header {
    background: #2d5a27;
    padding: 2rem 2rem 1.6rem;
    position: relative;
  }

  .card-header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #f4a922, #e8831a);
  }

  .label {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    margin-bottom: 0.5rem;
  }

  h1 {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.01em;
  }

  .card-body {
    padding: 1.8rem 2rem;
  }

  .intro {
    font-size: 0.82rem;
    color: #888;
    margin-bottom: 1.4rem;
    line-height: 1.5;
    letter-spacing: 0.01em;
  }

  ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  li a {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.9rem 1rem;
    border-radius: 2px;
    background: #f8f6f2;
    text-decoration: none;
    color: #1a1a1a;
    font-size: 0.9rem;
    font-weight: 600;
    border-left: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }

  li a::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #2d5a27;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  li a:hover {
    background: #eef4ec;
    border-left-color: #2d5a27;
    color: #2d5a27;
  }

  li a:hover::before {
    background: #f4a922;
  }

  .arrow {
    margin-left: auto;
    font-size: 0.75rem;
    color: #bbb;
    transition: color 0.15s, transform 0.15s;
  }

  li a:hover .arrow {
    color: #2d5a27;
    transform: translateX(3px);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="label">NT Parks &amp; Wildlife</div>
      <h1>Park List</h1>
    </div>
    <div class="card-body">
      <p class="intro">Captive portal / splash pages for the following parks:</p>
      <ul>
        <li>
          <a href="wangi-falls-simplified.html">
            Wangi Falls - simplified
            <span class="arrow">›</span>
          </a>
        </li>






         
        <li>
          <a href="watarrka.html">
            Watarrka
            <span class="arrow">›</span>
          </a>
        </li>
        <li>
          <a href="karlu-karlu.html">
            Karlu Karlu (Devils Marbles)
            <span class="arrow">›</span>
          </a>
     
      </ul>
    </div>
  </div>
</body>
</html>
