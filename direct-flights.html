
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Section</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
 
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
 
    .hero__bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
 
    .hero__overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
    }
 
    .hero__content {
      position: relative;
      z-index: 1;
      display: block;
      align-items: center;
      gap: 8px;
    }
 
    .hero__content select {
      padding: 10px 14px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
 
    .hero__content button {
      padding: 10px 18px;
      font-size: 1rem;
      background: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
 
    .hero__content button:hover {
      background: #e8e8e8;
    }
  </style>
</head>
<body>
 
  <section class="hero">
    <img
      class="hero__bg"
      sizes="(min-width: 374.98px) 100vw, (min-width: 479.98px) 100vw, (min-width: 749.98px) 100vw, (min-width: 767.98px) 100vw, (min-width: 959.98px) 100vw, (min-width: 1282.98px) 100vw, (min-width: 1919.98px) 100vw"
      srcset="https://img2.storyblok.com/375x600/filters:format(webp):quality(80)/f/286255898790625/2449x1633/ad5404058b/women_standing_at_baruwei_lookout__nitmiluk_gorge.jpg 375w,
              https://img2.storyblok.com/480x800/filters:format(webp):quality(80)/f/286255898790625/2449x1633/ad5404058b/women_standing_at_baruwei_lookout__nitmiluk_gorge.jpg 480w,
              https://img2.storyblok.com/750x1200/filters:format(webp):quality(80)/f/286255898790625/2449x1633/ad5404058b/women_standing_at_baruwei_lookout__nitmiluk_gorge.jpg 750w,
              https://img2.storyblok.com/768x800/filters:format(webp):quality(80)/f/286255898790625/2449x1633/ad5404058b/women_standing_at_baruwei_lookout__nitmiluk_gorge.jpg 768w,
              https://img2.storyblok.com/960x1600/filters:format(webp):quality(80)/f/286255898790625/2449x1633/ad5404058b/women_standing_at_baruwei_lookout__nitmiluk_gorge.jpg 960w,
              https://img2.storyblok.com/1283x800/filters:format(webp):quality(80)/f/286255898790625/2449x1633/ad5404058b/women_standing_at_baruwei_lookout__nitmiluk_gorge.jpg 1283w,
              https://img2.storyblok.com/1920x1200/filters:format(webp):quality(80)/f/286255898790625/2449x1633/ad5404058b/women_standing_at_baruwei_lookout__nitmiluk_gorge.jpg 1920w"
      src="https://img2.storyblok.com/1920x1200/filters:format(webp):quality(80)/f/286255898790625/2449x1633/ad5404058b/women_standing_at_baruwei_lookout__nitmiluk_gorge.jpg"
      alt="Women standing at Baruwei Lookout, Nitmiluk Gorge"
      loading="eager"
    >
    <div class="hero__overlay"></div>
 
    <div class="hero__content">
       <div style="color: yellow;"><h1> Fly direct to Darwin</h1>
        <p>Location</p>
        </div> 
        <div>
      <select name="options" id="options">
        <option value="Sydney">Sydney - Darwin</option>
        <option value="Melbourne">Melbourne - Darwin</option>
        <option value="Brisbane">Brisbane - Darwin</option>
        <option value="Canberra">Canberra - Darwin</option>
        <option value="Perth">Perth - Darwin</option>
        <option value="Adelaide">Adelaide - Darwin</option>
      </select>
      <button onclick="window.open('https://www.webjet.com.au/destinations/northernterritory', '_blank')">Book now</button>
    </div>
    </div>
 
  </section>
 
</body>
</html>
